id: dev.taskfile.Task.tool.podman
default-branch: stable
runtime: dev.taskfile.Task
runtime-version: stable
sdk: org.freedesktop.Sdk//26.08
build-extension: true
build-options:
  strip: true
modules:
  - name: podman-remote
    buildsystem: simple
    build-commands:
      - install -D podman-remote-static-linux_amd64 ${FLATPAK_DEST}/bin/podman-remote
      - ln --symbolic ${FLATPAK_DEST}/bin/podman-remote ${FLATPAK_DEST}/bin/podman
    sources:
      - type: archive
        url: https://github.com/podman-container-tools/podman/releases/download/v6.1.2/podman-remote-static-linux_amd64.tar.gz
        sha256: 6785e4dc11dad67000308749fed0f981698792309830a6b870bd5a97b3527182
